<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loss Triangle | Zombie Risk Simulator</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <style>
    :root {
      --bg: #070a12;
      --card: rgba(16, 23, 42, 0.85);
      --border: rgba(57, 255, 20, 0.2);
      --green: #39ff14; /* Toxic Green */
      --cyan: #00f3ff;  /* Bio Cyan */
      --magenta: #ff0055; /* Outbreak Red */
      --amber: #ffaa00; /* Hazard Amber */
      --purple: #bf00ff; /* Mutation Purple */
      --text: #f1f5f9;
      --text-muted: #64748b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }

    body {
      background: var(--bg);
      color: var(--text);
      padding: 1.5rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(57, 255, 20, 0.03) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(255, 0, 85, 0.03) 0%, transparent 40%);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1rem;
    }

    .title-group h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #fff 30%, var(--green));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle { color: var(--text-muted); font-size: 0.88rem; margin-top: 0.2rem; }

    /* Top Grid: Animation & Solvency */
    .top-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 1.25rem;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.25rem;
      backdrop-filter: blur(16px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      position: relative;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--cyan);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    /* Animation Canvas & Controls */
    #outbreak-canvas {
      width: 100%;
      height: 160px;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 10px;
      border: 1px dashed rgba(255, 255, 255, 0.1);
    }

    .story-controls {
      display: flex;
      gap: 0.75rem;
      align-items: center;
      margin-top: 1rem;
    }

    button {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.65rem 1.25rem;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
    }

    button:hover {
      background: rgba(57, 255, 20, 0.15);
      border-color: var(--green);
      color: var(--green);
      transform: translateY(-2px);
    }

    button.btn-primary {
      background: var(--green);
      color: #000;
      border-color: var(--green);
      box-shadow: 0 0 15px rgba(57, 255, 20, 0.4);
    }

    button.btn-primary:hover {
      background: #50ff30;
      box-shadow: 0 0 25px rgba(57, 255, 20, 0.7);
      color: #000;
    }

    button.btn-hazard {
      border-color: var(--magenta);
      color: var(--magenta);
    }
    button.btn-hazard:hover {
      background: rgba(255, 0, 85, 0.2);
    }

    /* Solvency Gauge HUD */
    .hud-stat {
      text-align: center;
      padding: 1rem;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 10px;
      border-left: 4px solid var(--green);
      margin-bottom: 0.75rem;
    }

    .hud-val {
      font-size: 1.8rem;
      font-weight: 800;
      margin-top: 0.2rem;
      font-family: monospace;
    }

    .status-pill {
      display: inline-block;
      padding: 0.3rem 0.8rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-top: 0.5rem;
    }

    .pill-safe { background: rgba(57, 255, 20, 0.2); color: var(--green); border: 1px solid var(--green); }
    .pill-danger { background: rgba(255, 0, 85, 0.2); color: var(--magenta); border: 1px solid var(--magenta); animation: blink 1s infinite; }

    @keyframes blink { 50% { opacity: 0.5; } }

    /* Bottom Grid: Triangle & Math */
    .bottom-grid {
      display: grid;
      grid-template-columns: 2.2fr 1fr;
      gap: 1.25rem;
    }

    .table-container { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 4px;
    }

    th, td {
      padding: 0.65rem;
      text-align: center;
      font-size: 0.85rem;
      border-radius: 6px;
      font-family: monospace;
      position: relative;
    }

    th { background: rgba(0, 0, 0, 0.5); color: var(--text-muted); font-weight: 700; }
    
    th.ldf-col-header {
      background: rgba(191, 0, 255, 0.15);
      color: var(--purple);
      border: 1px dashed rgba(191, 0, 255, 0.4);
    }

    td.cell-actual {
      background: rgba(0, 243, 255, 0.1);
      color: var(--cyan);
      border: 1px solid rgba(0, 243, 255, 0.2);
      cursor: pointer;
      font-weight: 700;
    }

    td.cell-actual:hover {
      background: rgba(0, 243, 255, 0.25);
      border-color: var(--cyan);
    }

    td.cell-outlier {
      text-decoration: line-through;
      opacity: 0.35;
      background: rgba(255, 0, 85, 0.15);
      color: var(--magenta);
      border-color: var(--magenta);
    }

    td.cell-forecast {
      background: rgba(191, 0, 255, 0.1);
      color: var(--purple);
      border: 1px dashed rgba(191, 0, 255, 0.3);
      font-style: italic;
    }

    td.cell-ldf {
      background: rgba(191, 0, 255, 0.05);
      color: var(--purple);
      font-weight: 800;
      cursor: help;
    }

    td.cell-ldf:hover {
      background: rgba(191, 0, 255, 0.25);
      box-shadow: 0 0 10px rgba(191, 0, 255, 0.5);
    }

    /* Math Tooltip Card */
    .math-card {
      background: rgba(0, 0, 0, 0.6);
      border-left: 3px solid var(--purple);
      padding: 0.8rem;
      border-radius: 6px;
      margin-bottom: 0.8rem;
      font-size: 0.8rem;
      line-height: 1.4;
    }

    .math-title { color: var(--purple); font-weight: 700; margin-bottom: 0.3rem; }

    /* Responsive */
    @media (max-width: 900px) {
      .top-grid, .bottom-grid { grid-template-columns: 1fr; }
    }
  </style
